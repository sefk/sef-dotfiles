onboarding = false

[keys]
prefix = "ctrl+a"
previous_workspace = "shift+left"    # tmux S-Left
next_workspace     = "shift+right"   # tmux S-Right
split_vertical     = "prefix+|"      # side-by-side split on | (was prefix+v)

# pane focus on prefix+arrows (native actions, so they forward over --remote).
# Reassigning these unmaps the herdr default prefix+{hjkl}.
# Disabling to try keeping my home keys
# focus_pane_left    = "prefix+left"
# focus_pane_down    = "prefix+down"
# focus_pane_up      = "prefix+up"
# focus_pane_right   = "prefix+right"
cycle_pane_next     = "ctrl+comma"        # direct chord, no prefix needed; ctrl+tab/ctrl+shift+tab left alone for ghostty's native tab cycling
cycle_pane_previous = "ctrl+shift+comma"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = true  # workspaces are mostly single-tab

# Reclaim the scrollbar column permanently. The scrollbar is drawn *inside* the
# pane width, so it appears and disappears as scrollback grows -- and the pane
# oscillates between 219 and 218 columns mid-session (measured: a ruler of the
# stty-reported width fills the row exactly at both sizes, so herdr and the app
# agree at any instant; the problem is that the instant keeps changing).
#
# Every width flip re-wraps every soft-wrapped line in nvim, and cells stranded
# at the old right edge survive the repaint: orphaned word-tails down the right
# margin, duplicated line fragments, a statusline shifted a column left. Long
# soft-wrapped markdown triggers it constantly because those rows fill the full
# width; a shell prompt never reaches the edge, which is why only editing broke.
pane_scrollbars = false

[ui.toast]
delivery = "system"                  # macOS desktop notification when herdr isn't focused

[session]
resume_agents_on_restore = true      # resume agent conversations after a server restart

[experimental]
pane_history = true                  # scrollback survives full server restarts

# Custom command keybinds. Fully-qualified [[keys.command]] so position doesn't
# matter (kept at the end to leave the [keys] scalar block clean).
#
# prefix+n (Ctrl-A n): scaffold a task workspace -- prompts for a name + dir in a
# popup, then builds a named workspace with claude (left) + shell (right), cwd set.
# Script: bin/herdr-new-task (symlinked into ~/bin).
[[keys.command]]
key = "prefix+n"
type = "popup"
command = "herdr-new-task"
description = "new task workspace"
width = "70%"
height = 18

# prefix+t / prefix+y: copy the last table from the focused pane to the clipboard.
# herdr-copy-table reads the pane, rebuilds clean columns from the box-drawing
# render, and emits OSC 52 -- which herdr forwards to the *client* clipboard, so
# it lands on whatever machine you're attached from (local or laptop over remote).
#   prefix+t -> markdown (docs, Notion, GitHub, Slack-as-text)
#   prefix+y -> TSV       (paste straight into Sheets/Excel cells)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "herdr-copy-table --format md"
description = "copy last table (markdown)"
width = "50%"
height = 4

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "herdr-copy-table --format tsv"
description = "copy last table (tsv)"
width = "50%"
height = 4
